name: ACR action smoke

# Manual end-to-end check of the published composite action.
# It intentionally scans a known-broken example with fail-on: never, so the
# job verifies installation + finding output without failing the build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the published ACR action
        id: acr
        uses: meiluosi/agent-composition-review@v0.5.1
        with:
          path: examples/langgraph-subgraph-leak/broken.py
          fail-on: never

      - name: Check Action outputs and SARIF
        run: |
          set -euo pipefail
          test "${{ steps.acr.outputs.findings }}" = "2"
          test -f "${{ steps.acr.outputs['sarif-file'] }}"
          python - "${{ steps.acr.outputs['sarif-file'] }}" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          results = doc["runs"][0]["results"]
          assert len(results) == 2, results
          print("SARIF results:", len(results))
          PY
