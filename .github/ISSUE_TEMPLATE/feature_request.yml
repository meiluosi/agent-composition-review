name: 功能请求
description: 提出新的诊断规则、CLI 能力或集成需求
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。提交前请先搜索现有 issue 和 `acr rules` 输出，确认这不是已有能力。

        功能请求请尽量描述**具体的组合故障场景**和**可验证的验收标准**，而不只是“希望更智能”。
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: |
        你想诊断哪一类 LangGraph/LangChain 组合故障？现在如何排查、哪里最费时？
        为什么现有的 `acr scan` / `acr trace` 规则不够用？请给出一个具体例子或症状。
      placeholder: |
        例如：子图在 checkpointer 恢复后只重放部分节点，导致外部副作用重复；
        目前 acr trace 只能看到同一节点重复写，无法判断恢复边界。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: |
        你希望增加什么？可以是新规则 ID、新的 `acr` 命令/参数、JSON 输出字段、
        严重度或退出码约定、文档章节或集成方式。
      placeholder: |
        例如：新增规则 ACR107，检测 checkpoint 恢复后重复执行的非幂等工具调用；
        输出节点名、恢复轮次和证据事件 ID。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: |
        怎样算完成？请写可验证的条件：给定什么输入，acr 应输出什么、退出码是什么、
        JSON 中应出现哪些字段，以及哪些情况应保持不报（避免误报）。
      placeholder: |
        输入：tests/fixtures/restore_replay.jsonl
        期望：acr trace 输出 ACR107，evidence 指向 event 3 和 event 7
        期望：修复后同一 trace 不再报 ACR107
        不报：首次执行且未恢复的重复调用
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法、现有 workaround，或为什么它们不够好。
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: |
        相关 issue、文档、公开案例或参考资料。涉及真实轨迹时请先脱敏，
        不要粘贴密钥、个人信息、客户数据或未公开代码。
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 issue 和 `acr rules`，确认这不是已有能力。
          required: true
        - label: 我已删除或替换提交内容中的密钥、个人信息、客户数据和未脱敏轨迹。
          required: true
