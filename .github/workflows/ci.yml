name: Skill and framework regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-eval.txt
            requirements-benchmark.txt
      - name: Install evaluation dependencies
        run: python -m pip install -r requirements-eval.txt -r requirements-benchmark.txt
      - name: Check skill and repository
        run: python scripts/check_repo.py
      - name: Run framework regressions (not model capability evaluation)
        run: python scripts/run_evals.py --output evals/runs/latest-local.json
      - name: Check attribution input isolation and strict scorer
        run: python -m unittest evals.external.test_core evals.external.test_analysis evals.iterations.test_ablation -v
      - name: Check evidence records and paired mechanism evaluation
        run: python -m unittest evals.mechanisms.test_evidence evals.mechanisms.test_core evals.mechanisms.test_analysis -v
      - name: Check executable contracts, generated inputs, replay and independent acceptance
        run: python -m unittest evals.replay.test_runtime evals.replay.test_protocol -v
      - name: Check autonomous code repair fixtures and evaluation isolation
        run: python -m unittest evals.code_repair.test_fixtures evals.code_repair.test_protocol -v
      - name: Preserve the post-freeze normal-control counterexamples
        run: python -m unittest evals.code_repair_followup.test_cleanup evals.code_repair_followup.test_transaction -v
      - name: Check cross-model fixtures, isolation and development decisions
        run: |
          python -m unittest evals.model_interaction.test_fixtures evals.model_interaction.test_protocol evals.model_interaction.test_analysis -v
          python -S evals/model_interaction/review_lease_queue.py
          python -S evals/model_interaction/tasks/lease_queue/mutation_audit.py
          python -S evals/model_interaction/tasks/retrieval_cache/mutation_audit.py
          python -S evals/model_interaction/tasks/stream_events/mutation_audit.py
          python -S evals/model_interaction/tasks/tool_results/mutation_audit.py
      - name: Preserve cross-model post-freeze JSON counterexample
        run: python -B -S -m unittest evals.model_interaction_followup.test_stream_json -v
      - name: Verify published scores and redraw benchmark figures (no model calls)
        run: python scripts/plot_external_eval.py
      - name: Verify development ablation scores and figures (no model calls)
        run: python scripts/analyze_ablation.py publish
      - name: Verify paired mechanism scores and figures (no model calls)
        run: python scripts/analyze_mechanisms.py publish
      - name: Verify executed contract regression summary
        run: python scripts/verify_contract_regression.py
      - name: Verify configuration repairs and redraw figures (no model calls)
        run: python scripts/analyze_replay.py publish
      - name: Re-execute published code repairs and verify frozen results (no model calls)
        run: python scripts/analyze_code_repair.py publish
      - name: Verify separate recovered reviews and post-hoc boundary evidence
        run: |
          python scripts/analyze_recovered_code_reviews.py
          python scripts/audit_code_repair_boundaries.py
          python scripts/render_code_repair_report.py
      - name: Replay frozen cross-model outcomes (no model calls)
        run: |
          python scripts/analyze_model_interaction.py
          python scripts/render_model_interaction_report.py
      - name: Package runtime skill
        run: python scripts/build_skill.py
      - name: Package unpromoted modular candidate separately
        run: python scripts/build_skill.py --source evals/iterations/v3-candidate
      - name: Package executable candidate separately
        run: python scripts/build_skill.py --source candidates/v4/agent-composition-review --output dist/agent-composition-review-v4.zip
      - name: Save runtime package and evaluation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-and-framework-evidence
          path: |
            dist/agent-composition-review.zip
            dist/agent-composition-review-candidate.zip
            dist/agent-composition-review-v4.zip
            evals/runs/latest-local.json
          if-no-files-found: warn
