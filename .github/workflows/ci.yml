name: Skill and framework regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-eval.txt
            requirements-benchmark.txt
      - name: Install evaluation dependencies
        run: python -m pip install -r requirements-eval.txt -r requirements-benchmark.txt
      - name: Check skill and repository
        run: python scripts/check_repo.py
      - name: Run framework regressions (not model capability evaluation)
        run: python scripts/run_evals.py --output evals/runs/latest-local.json
      - name: Check attribution input isolation and strict scorer
        run: python -m unittest evals.external.test_core evals.external.test_analysis evals.iterations.test_ablation -v
      - name: Verify published scores and redraw benchmark figures (no model calls)
        run: python scripts/plot_external_eval.py
      - name: Verify development ablation scores and figures (no model calls)
        run: python scripts/analyze_ablation.py publish
      - name: Package runtime skill
        run: python scripts/build_skill.py
      - name: Save runtime package and evaluation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-and-framework-evidence
          path: |
            dist/agent-composition-review.zip
            evals/runs/latest-local.json
          if-no-files-found: warn
